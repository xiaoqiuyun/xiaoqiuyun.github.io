<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f5f1" />
  <meta name="description" content="冯婉婷的个人作品集，记录城市、体验与数字产品。" />
  <title>冯婉婷 · 个人作品集</title>
  <style>
    :root { color-scheme: light; --ink: #20251f; --muted: #697067; --line: #d9ddd5; --paper: #f5f5f1; --white: #fff; --green: #c8f169; --coral: #e46d54; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .page { width: min(100% - 80px, 1240px); margin: 0 auto; }
    .topbar { min-height: 82px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .identity { display: flex; align-items: center; gap: 12px; font-weight: 800; }
    .mark { display: grid; place-items: center; width: 34px; height: 34px; background: var(--green); font-size: 17px; }
    .nav { display: flex; gap: 30px; align-items: center; color: var(--muted); font-size: 13px; }
    .nav a:hover { color: var(--ink); }
    .hero { padding: 74px 0 66px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 32px; }
    .eyebrow, .mono { font-family: "DM Mono", Consolas, monospace; letter-spacing: 0; }
    .eyebrow { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    h1 { margin: 20px 0 17px; font-size: 76px; line-height: 1.08; font-weight: 900; letter-spacing: 0; }
    h1 span { color: var(--coral); }
    .intro { max-width: 560px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.9; }
    .hero-note { padding-left: 22px; border-left: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.9; }
    .hero-note strong { display: block; color: var(--ink); font-family: "DM Mono", Consolas, monospace; font-size: 30px; font-weight: 500; }
    .work-head { padding: 20px 0; border-top: 1px solid var(--ink); display: flex; align-items: baseline; justify-content: space-between; gap: 20px; }
    .work-head h2 { margin: 0; font-size: 17px; font-weight: 800; }
    .work-head span { color: var(--muted); font-size: 12px; }
    .project { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, .7fr); gap: 42px; align-items: center; padding: 0 0 65px; }
    .preview-wrap { position: relative; overflow: hidden; aspect-ratio: 1.55; background: #dfe5dc; border: 1px solid var(--line); }
    .preview-wrap::after { content: ""; position: absolute; inset: 0; border: 1px solid rgba(32,37,31,.08); pointer-events: none; }
    .preview { display: block; width: 200%; height: 200%; border: 0; transform: scale(.5); transform-origin: top left; pointer-events: none; }
    .project-info { padding: 14px 0; }
    .project-number { color: var(--coral); font: 12px "DM Mono", Consolas, monospace; }
    .project-info h3 { margin: 12px 0 12px; font-size: 30px; line-height: 1.3; }
    .project-info p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.9; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 24px; }
    .tag { padding: 6px 9px; border: 1px solid var(--line); color: #50574e; font-size: 11px; }
    .open-project { display: inline-flex; align-items: center; gap: 14px; min-height: 46px; padding: 0 16px; background: var(--ink); color: var(--white); font-size: 12px; font-weight: 700; transition: background .2s, color .2s; }
    .open-project:hover { background: var(--green); color: var(--ink); }
    .open-project span { font-size: 17px; }
    .footer { display: flex; justify-content: space-between; gap: 20px; padding: 19px 0 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .footer a { color: var(--ink); }
    @media (max-width: 760px) {
      .page { width: min(100% - 36px, 560px); }
      .topbar { min-height: 68px; }
      .nav { gap: 16px; font-size: 12px; }
      .hero { grid-template-columns: 1fr; padding: 53px 0 44px; gap: 24px; }
      h1 { font-size: 52px; margin: 16px 0 14px; }
      .intro { font-size: 14px; }
      .hero-note { display: flex; align-items: center; gap: 12px; padding: 0; border: 0; }
      .hero-note strong { font-size: 23px; }
      .project { grid-template-columns: 1fr; gap: 22px; padding-bottom: 42px; }
      .preview-wrap { aspect-ratio: 1.12; }
      .project-info h3 { font-size: 26px; }
      .footer { flex-direction: column; gap: 8px; }
    }
    @media (max-width: 390px) { .nav { gap: 10px; } .identity { gap: 8px; font-size: 13px; } .mark { width: 30px; height: 30px; } h1 { font-size: 46px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="identity" href="#top" aria-label="冯婉婷作品集首页"><span class="mark">F</span><span>冯婉婷</span></a>
      <nav class="nav" aria-label="主导航"><a href="#works">作品</a><a href="https://github.com/xiaoqiuyun" target="_blank" rel="noreferrer">GitHub ↗</a></nav>
    </header>
    <main id="top">
      <section class="hero" aria-labelledby="intro-title">
        <div>
          <div class="eyebrow">Selected work · 2026</div>
          <h1 id="intro-title">你好，我是<br /><span>冯婉婷。</span></h1>
          <p class="intro">这里收录我关于城市、体验与数字产品的探索。每个作品，都是把一个想法认真做出来的过程。</p>
        </div>
        <div class="hero-note"><strong>01</strong><span>个作品<br />持续更新中</span></div>
      </section>
      <section id="works" aria-labelledby="works-title">
        <div class="work-head"><h2 id="works-title">作品集</h2><span class="mono">SELECTED PROJECTS / 01</span></div>
        <article class="project">
          <a class="preview-wrap" href="weekend-city-explorer/" aria-label="打开作品：周末城市探索指南">
            <iframe class="preview" src="weekend-city-explorer/" title="周末城市探索指南页面预览" loading="lazy" tabindex="-1"></iframe>
          </a>
          <div class="project-info">
            <div class="project-number">01 / PERSONAL PROJECT</div>
            <h3>周末城市探索指南</h3>
            <p>根据天气、预算和兴趣，发现今天值得出发的城市活动。为周末做一份轻松、可探索的灵感清单。</p>
            <div class="tags"><span class="tag">产品设计</span><span class="tag">城市探索</span><span class="tag">交互体验</span></div>
            <a class="open-project" href="weekend-city-explorer/">查看作品 <span aria-hidden="true">↗</span></a>
          </div>
        </article>
      </section>
    </main>
    <footer class="footer"><span>冯婉婷 · 个人作品集</span><a href="https://github.com/xiaoqiuyun" target="_blank" rel="noreferrer">github.com/xiaoqiuyun ↗</a></footer>
  </div>
</body>
</html>
